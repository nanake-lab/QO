[package]
name = "qo-adapter-codex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
qo-harness = { version = "=0.1.0", path = "../server/harness" }
qo-protocol.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
uuid = { version = "=1.29.3", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
