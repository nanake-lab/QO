[package]
name = "qo-server"
default-run = "qo-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["embedded-web"]
embedded-web = ["dep:include_dir"]
test-harness = ["qo-harness/test-harness"]

[[bin]]
name = "qo-server"
path = "src/main.rs"
required-features = ["embedded-web"]

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
sha2 = "=0.10.9"
uuid = { version = "=1.29.3", features = ["v4"] }
axum = { version = "=0.8.9", features = ["ws"] }
getrandom = "=0.4.3"
hex = "=0.4.3"
include_dir = { version = "=0.7.4", optional = true }
open = { version = "=5.4.5", features = ["shellexecute-on-windows"] }
qo-protocol.workspace = true
qo-adapter-codex = { version = "=0.1.0", path = "../adapter-codex" }
qo-harness = { version = "=0.1.0", path = "harness" }
rusqlite = { version = "=0.43.0", features = ["bundled", "fallible_uint", "serde_json"] }
serde.workspace = true
serde_json.workspace = true
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "fs"] }
tungstenite = "=0.29.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[dev-dependencies]
qo-conformance = { version = "=0.1.0", path = "../conformance" }
