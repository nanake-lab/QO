[package]
name = "qo-mock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
qo-server = { version = "=0.1.0", path = "../server", default-features = false }
qo-harness = { version = "=0.1.0", path = "../server/harness", features = ["test-harness"] }
qo-protocol.workspace = true
serde_json.workspace = true
uuid = { version = "=1.29.3", features = ["v4"] }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
qo-conformance = { version = "=0.1.0", path = "../conformance" }
tungstenite = "=0.29.0"
